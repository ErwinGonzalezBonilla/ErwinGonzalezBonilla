<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Erwin González · Automatización con n8n, IA aplicada y Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#0A1A20"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C9CFF"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1F2A33"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
      .wire { fill: none; stroke: #00E5FF; stroke-width: 2; stroke-dasharray: 5 7; opacity: .75; animation: flow 1.1s linear infinite; }
      .node { fill: #0D1117; stroke: #2B3540; stroke-width: 1.5; }
      .node.hot { stroke: #00E5FF; stroke-opacity: .7; }
      .port { fill: #00E5FF; }
      .live { animation: pulse 1.6s ease-in-out infinite; }
      .up1 { animation: fadeUp .9s ease-out both; }
      .up2 { animation: fadeUp .9s .15s ease-out both; }
      .up3 { animation: fadeUp .9s .3s ease-out both; }
      .up4 { animation: fadeUp .9s .45s ease-out both; }
      .up5 { animation: fadeUp .9s .6s ease-out both; }
      .graph { animation: fadeIn 1.2s .4s ease-out both; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="2" fill="url(#topline)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="18" fill="none" stroke="#1E2A33" stroke-width="1.5"/>

  <!-- ───── Columna izquierda ───── -->
  <g class="up1">
    <rect x="72" y="62" width="262" height="30" rx="15" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".35"/>
    <circle cx="92" cy="77" r="4.5" fill="#3FB950" class="live"/>
    <text x="106" y="82" class="mono" font-size="12" letter-spacing="2" fill="#8FEFFA">DISPONIBLE PARA PROYECTOS</text>
  </g>

  <text x="70" y="160" class="sans up2" font-size="60" font-weight="800" fill="#F0F6FC" letter-spacing="-1.5">Erwin González</text>

  <text x="72" y="204" class="sans up3" font-size="21" font-weight="600" fill="url(#accent)">Automatización con n8n · IA aplicada · Full Stack</text>

  <text x="72" y="244" class="sans up4" font-size="16.5" fill="#9AA6B2">Convierto el trabajo manual de los negocios en flujos automáticos,</text>
  <text x="72" y="268" class="sans up4" font-size="16.5" fill="#9AA6B2">agentes de IA y prototipos funcionales en días.</text>

  <text xml:space="preserve" x="72" y="312" class="up5 mono" font-size="12.5" letter-spacing="1.5" fill="#6E7B88">MADRID<tspan fill="#00E5FF"> · </tspan>PRESENCIAL O REMOTO<tspan fill="#00E5FF"> · </tspan>ES / EN</text>

  <!-- ───── Flujo animado ───── -->
  <g class="graph">
    <circle cx="707" cy="66" r="4" fill="#3FB950" class="live"/>
    <text x="720" y="70" class="mono" font-size="12" fill="#6E7B88">workflow.n8n — ejecutando</text>

    <!-- cables -->
    <path id="p1" class="wire" d="M820 176 L870 176"/>
    <path id="p2" class="wire" d="M990 176 C1015 176 1015 116 1040 116"/>
    <path id="p3" class="wire" d="M990 176 C1015 176 1015 236 1040 236"/>

    <!-- nodo 1 -->
    <rect x="700" y="148" width="120" height="56" rx="11" class="node"/>
    <text x="714" y="168" class="mono" font-size="9.5" letter-spacing="1.5" fill="#00C8E0">TRIGGER</text>
    <text x="714" y="190" class="sans" font-size="15" font-weight="600" fill="#E6EDF3">Formulario</text>
    <circle cx="820" cy="176" r="4" class="port"/>

    <!-- nodo 2 -->
    <rect x="870" y="148" width="120" height="56" rx="11" class="node hot"/>
    <text x="884" y="168" class="mono" font-size="9.5" letter-spacing="1.5" fill="#00C8E0">LÓGICA</text>
    <text x="884" y="190" class="sans" font-size="15" font-weight="600" fill="#E6EDF3">IA + reglas</text>
    <circle cx="870" cy="176" r="4" class="port"/>
    <circle cx="990" cy="176" r="4" class="port"/>

    <!-- nodo 3 -->
    <rect x="1040" y="88" width="120" height="56" rx="11" class="node"/>
    <text x="1054" y="108" class="mono" font-size="9.5" letter-spacing="1.5" fill="#00C8E0">DATOS</text>
    <text x="1054" y="130" class="sans" font-size="15" font-weight="600" fill="#E6EDF3">Sheets / DB</text>
    <circle cx="1040" cy="116" r="4" class="port"/>

    <!-- nodo 4 -->
    <rect x="1040" y="208" width="120" height="56" rx="11" class="node"/>
    <text x="1054" y="228" class="mono" font-size="9.5" letter-spacing="1.5" fill="#00C8E0">AVISO</text>
    <text x="1054" y="250" class="sans" font-size="15" font-weight="600" fill="#E6EDF3">Notificación</text>
    <circle cx="1040" cy="236" r="4" class="port"/>

    <!-- paquetes de datos -->
    <circle r="4" fill="#FFFFFF" filter="url(#soft)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M820 176 L870 176 L990 176 C1015 176 1015 116 1040 116"/>
    </circle>
    <circle r="4" fill="#FFFFFF" filter="url(#soft)">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M820 176 L870 176 L990 176 C1015 176 1015 236 1040 236"/>
    </circle>

    <text x="700" y="308" class="mono" font-size="12" fill="#6E7B88">recibir → clasificar → registrar → notificar</text>
  </g>
</svg>
