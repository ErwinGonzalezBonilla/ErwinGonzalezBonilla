<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <style>
    .float { animation: float 3s ease-in-out infinite; transform-origin: 150px 150px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .led { animation: led 1.2s ease-in-out infinite; }
    @keyframes led { 0%,100% { fill: #00E5FF; opacity: 1; } 50% { fill: #FF3D7F; opacity: .6; } }
    .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .bar { animation: eq 1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .b2 { animation-delay: .15s; } .b3 { animation-delay: .3s; } .b4 { animation-delay: .45s; } .b5 { animation-delay: .6s; }
    @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    .wave { animation: wave 2s ease-in-out infinite; transform-origin: 239px 190px; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(22deg); } }
    .ring { animation: ring 2.4s ease-out infinite; transform-origin: 150px 40px; }
    @keyframes ring { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
    .shadow { animation: shadow 3s ease-in-out infinite; transform-origin: 150px 284px; }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.8); opacity: .2; } }
  </style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A3A"/><stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062A33"/><stop offset="1" stop-color="#03141A"/>
    </linearGradient>
  </defs>

  <ellipse class="shadow" cx="150" cy="284" rx="70" ry="8" fill="#00E5FF"/>

  <g class="float">
    <!-- antena -->
    <circle class="ring" cx="150" cy="40" r="10" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <line x1="150" y1="48" x2="150" y2="72" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <circle class="led" cx="150" cy="40" r="9"/>

    <!-- cabeza -->
    <rect x="86" y="72" width="128" height="96" rx="24" fill="url(#body)" stroke="#00E5FF" stroke-width="3"/>
    <rect x="76" y="104" width="10" height="32" rx="4" fill="#00E5FF" opacity=".7"/>
    <rect x="214" y="104" width="10" height="32" rx="4" fill="#00E5FF" opacity=".7"/>
    <rect x="100" y="86" width="100" height="68" rx="14" fill="url(#screen)" stroke="#00E5FF" stroke-opacity=".35"/>
    <!-- ojos -->
    <rect class="eye" x="118" y="102" width="20" height="20" rx="6" fill="#00E5FF"/>
    <rect class="eye" x="162" y="102" width="20" height="20" rx="6" fill="#00E5FF"/>
    <!-- boca ecualizador -->
    <rect class="bar" x="128" y="132" width="6" height="14" rx="2" fill="#00E5FF"/>
    <rect class="bar b2" x="138" y="132" width="6" height="14" rx="2" fill="#00E5FF"/>
    <rect class="bar b3" x="148" y="132" width="6" height="14" rx="2" fill="#00E5FF"/>
    <rect class="bar b4" x="158" y="132" width="6" height="14" rx="2" fill="#00E5FF"/>
    <rect class="bar b5" x="168" y="132" width="6" height="14" rx="2" fill="#00E5FF"/>

    <!-- cuello y cuerpo -->
    <rect x="136" y="168" width="28" height="10" fill="#1F2A3A" stroke="#00E5FF" stroke-width="2"/>
    <rect x="98" y="178" width="104" height="82" rx="18" fill="url(#body)" stroke="#00E5FF" stroke-width="3"/>
    <!-- panel del pecho -->
    <rect x="116" y="194" width="68" height="26" rx="6" fill="url(#screen)" stroke="#00E5FF" stroke-opacity=".35"/>
    <text x="150" y="212" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF">&lt;/&gt; IA</text>
    <circle class="led" cx="126" cy="240" r="5"/>
    <circle cx="150" cy="240" r="5" fill="#2EA043"/>
    <circle cx="174" cy="240" r="5" fill="#F2C35B"/>

    <!-- brazo izquierdo -->
    <rect x="66" y="186" width="26" height="58" rx="13" fill="url(#body)" stroke="#00E5FF" stroke-width="3"/>
    <rect x="198" y="184" width="44" height="14" rx="7" fill="#1F2A3A" stroke="#00E5FF" stroke-width="3"/>
    <rect x="58" y="184" width="44" height="14" rx="7" fill="#1F2A3A" stroke="#00E5FF" stroke-width="3"/>
    <!-- brazo derecho saludando -->
    <g class="wave">
      <rect x="226" y="132" width="26" height="58" rx="13" fill="url(#body)" stroke="#00E5FF" stroke-width="3"/>
      <circle cx="239" cy="124" r="12" fill="#1F2A3A" stroke="#00E5FF" stroke-width="3"/>
    </g>
  </g>
</svg>
